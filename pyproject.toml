[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ios_draftreport"
version = "0.1.0"
description = "IOS Draft Report project for dental scan analysis"
requires-python = ">=3.8"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "scripts*"]
