# Model configuration
model:
  qwen_model_name: "Qwen/Qwen3-VL-4B-Instruct"
  projection_type: "deepstack"  # simple, deepstack
  freeze_qwen: true
  freeze_point_encoder: false
  pretrained_point_encoder:  "/work/grana_maxillo/IOS-DraftReport/_checkpoints/checkpoints/point_bert_v1.2.pt"
  
  # Memory optimization
  use_gradient_checkpointing: true 
  low_cpu_mem_usage: true
  use_flash_attention: false
  
  # Point encoder config
  point_encoder:
    trans_dim: 384
    depth: 12
    num_heads: 6
    encoder_dims: 256
    group_size: 32
    num_group: 1024
    drop_path_rate: 0.1
  
  # Projection config
  projection:
    dropout: 0.1
    num_deepstack_levels: 3  # Number of intermediate layers to use (extracts from layers 3, 6, 9)
    injection_layer_indices: [0, 1, 2]  # Qwen layer indices for injection

# Data configuration
data:
  point_cloud_dir: "/work/grana_maxillo/IOS-DraftReport/_data/Dataset_FerraraDump_400_and_Bits2Bites"
  captions_dir: "/work/grana_maxillo/IOS-DraftReport/src/auto-captioning/real_captions"
  num_points: 32768
  normalize: true
  augment: true
  
  # Instruction template
  instruction_template_path: "/work/grana_maxillo/IOS-DraftReport/_data/qwen-template.txt"

# Training configuration
training:
  batch_size: 4
  num_epochs: 50
  learning_rate: 3.0e-4  # Default/fallback learning rate
  weight_decay: 0.01
  warmup_steps: 100
  max_grad_norm: 1.0
  
  # Component-specific learning rates
  point_encoder_lr: 3.0e-5 
  projection_lr: 3.0e-4
  qwen_lr: 0
  
  # Optimizer
  optimizer: "adamw"
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-8
  
  # Learning rate schedule
  lr_scheduler: "cosine"
  num_cycles: 0.5
  
  # Gradient accumulation
  gradient_accumulation_steps: 16
  
  # Mixed precision
  use_fp16: false
  use_bf16: true
  
  # Checkpointing
  save_steps: 500
  save_total_limit: 3
  output_dir: "outputs/pointqwen_with_semantic_loss"
  
  # Logging
  logging_steps: 10
  eval_steps: 500
  
  # Validation
  validation_split: 0.05
  validate_per_epoch: true
  generate_sample_during_val: true
  val_max_new_tokens: 1024
  
  # Generation metrics (BLEU, ROUGE, METEOR, Sentence-BERT)
  compute_generation_metrics: true  # Enable comprehensive metrics during validation
  max_samples_for_metrics: 2  # Limit number of samples to generate (set to null for all)
  compute_sbert: true  # Include Sentence-BERT similarity (slower but useful)
  return_per_field_accuracy: true  # Return per-field breakdown in addition to overall accuracy
  
  # Semantic Loss Configuration
  use_semantic_loss: true  # Enable semantic loss
  semantic_loss_weight: 0.5  # Weight for semantic loss (0.5 means equal importance with CE loss)
  semantic_loss_model: "sentence-transformers/all-MiniLM-L6-v2"  # Sentence embedding model (23M params)
  
  # Generation parameters for semantic loss computation during training
  semantic_generation:
    max_new_tokens: 256  # Shorter generation for efficiency during training
    temperature: 0.1
    top_p: 0.9
    top_k: 1
    do_sample: false
    repetition_penalty: 1.1
    no_repeat_ngram_size: 3
  
  # Generation parameters (used during validation sampling)
  generation:
    temperature: 0.1
    early_stopping: true
    do_sample: false
    num_beams: 4
    repetition_penalty: 1.1
    no_repeat_ngram_size: 3
    top_p: 0.9
    top_k: 1
    max_new_tokens: 1280

  
# Hardware configuration
hardware:
  num_gpus: 4
  num_workers: 8
  distributed: true
  ddp_backend: "nccl"
  
# Seed for reproducibility
seed: 42
use_wandb: true
