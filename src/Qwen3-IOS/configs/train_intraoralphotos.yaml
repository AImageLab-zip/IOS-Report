# Configuration for fine-tuning Qwen3 VL vision encoder with intraoral photos
# This config:
# - Freezes Qwen3 LLM completely  
# - Fine-tunes ONLY the vision encoder
# - Uses 5 intraoral photos per patient as input
# - Same caption-based training as main pipeline

# Model configuration
model:
  qwen_model_name: "Qwen/Qwen3-VL-4B-Instruct"
  attn_implementation: "sdpa"  # Use scaled dot-product attention (flash_attention_2 requires A100/H100)
  
  # Memory optimization
  use_gradient_checkpointing: false  # Vision encoder is smaller, might not need it
  low_cpu_mem_usage: true

# Data configuration
data:
  dataset_dir: "/work/grana_maxillo/IOS-DraftReport/_data/Dataset_FerraraDump_400"
  captions_dir: "/work/grana_maxillo/IOS-DraftReport/src/auto-captioning/real_captions"
  
  # Image preprocessing
  image_size: [512, 512]
  
  # Instruction template
  instruction_template_path: "/work/grana_maxillo/IOS-DraftReport/_data/qwen-template-iop.json"

# Training configuration
training:
  batch_size: 1
  num_epochs: 20
  learning_rate: 1.0e-5
  weight_decay: 0.01
  warmup_steps: 100
  max_grad_norm: 1.0
  
  # Optimizer
  optimizer: "adamw"
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-8
  
  # Learning rate schedule
  lr_scheduler: "cosine"
  
  # Gradient accumulation (to simulate larger batch size)
  gradient_accumulation_steps: 8  # Effective batch size = 2 * 8 = 16
  
  # Checkpointing
  save_every_n_epochs: 10
  output_dir: "outputs/qwen3vl_intraoralphotos"
  
  # Logging
  logging_steps: 10
  
  # Validation
  validation_split: 0.1  # 10% for validation
  validate_per_epoch: true

  # Generation metrics (BLEU, ROUGE, METEOR, Sentence-BERT)
  compute_generation_metrics: true  # Enable comprehensive metrics during validation
  max_samples_for_metrics: 50  # Limit number of samples to generate (set to null for all)
  compute_sbert: true  # Include Sentence-BERT similarity (slower but useful)
  return_per_field_accuracy: true  # Return per-field breakdown in addition to overall accuracy
  
  
# Hardware configuration
hardware:
  num_workers: 4  # Number of data loading workers
  
# Seed for reproducibility
seed: 42

# Weights & Biases (optional)
use_wandb: true
run_name: "qwen3vl_vision_finetuning_intraoral"
