# Model configuration
model:
  qwen_model_name: "Qwen/Qwen3-VL-4B-Instruct"
  projection_type: "simple"  # simple, deepstack
  freeze_qwen: true
  freeze_point_encoder: false
  # pretrained_point_encoder:  "../Point-BERT/_data/_checkpoints/Point-BERT.pth"
  
  # Memory optimization
  use_gradient_checkpointing: false 
  low_cpu_mem_usage: true
  use_flash_attention: false
  
  # Point encoder config
  point_encoder:
    trans_dim: 512
    depth: 12
    num_heads: 8
    encoder_dims: 512
    group_size: 32
    num_group: 1280
    drop_path_rate: 0.1
    projection_dropout: 0.2  # Dropout for output projection layer to prevent mode collapse
  
  # Projection config
  projection:
    dropout: 0.1
    num_deepstack_levels: 3  # Number of intermediate layers to use (extracts from layers 3, 6, 9)
    injection_layer_indices: [0, 1, 2]  # Qwen layer indices for injection

# Data configuration
data:
  point_cloud_dir: "/work/grana_maxillo/IOS-DraftReport/_data/ios-iop-text"
  captions_dir: "/work/grana_maxillo/IOS-DraftReport/src/auto-captioning/real_captions"
  num_points: 32768
  normalize: true
  augment: true
  
  # Instruction template
  instruction_template_path: "/work/grana_maxillo/IOS-DraftReport/_data/qwen-template.txt"

# Training configuration
training:
  batch_size: 8
  num_epochs: 50
  learning_rate: 1.0e-5 
  weight_decay: 0.01
  warmup_steps: 100
  max_grad_norm: 1.0
  
  # Optimizer
  optimizer: "adamw"
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-8
  
  # Learning rate schedule
  lr_scheduler: "cosine"
  num_cycles: 0.5
  
  # Gradient accumulation
  gradient_accumulation_steps: 1
  
  # Mixed precision
  use_fp16: false
  use_bf16: true
  
  # Checkpointing
  save_steps: 500
  save_total_limit: 3
  output_dir: "outputs/pointqwen_pretrain"
  
  # Logging
  logging_steps: 10
  eval_steps: 500
  
  # Validation
  validation_split: 0.1
  validate_per_epoch: true
  generate_sample_during_val: true
  val_max_new_tokens: 1024
  
  # Generation parameters (used during validation sampling)
  generation:
    temperature: 0.1
    early_stopping: true
    do_sample: false
    num_beams: 1
  
# Hardware configuration
hardware:
  num_gpus: 4
  num_workers: 8
  distributed: true
  ddp_backend: "nccl"
  
# Seed for reproducibility
seed: 42
use_wandb: true
