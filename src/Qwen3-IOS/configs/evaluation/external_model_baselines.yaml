# Evaluation settings
evaluation:
  num_samples: null  # null = evaluate all samples, or set a number to limit
  compute_sbert: true  # Compute Sentence-BERT similarity (slower but useful)
  return_per_field: true  # Return per-field accuracy breakdown
  
# Output settings
output:
  save_predictions: true  # Save individual predictions to files
  save_metrics: true  # Save metrics summary
