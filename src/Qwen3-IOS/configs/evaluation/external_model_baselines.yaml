  deepseek:
    model_name: "deepseek-vl-7b-chat"  # Update with actual model name
    api_key: null  # Set via DEEPSEEK_API_KEY environment variable or specify here
    api_base: "https://api.deepseek.com/v1"  # Update with actual API endpoint
    temperature: 0.7
