      Molar occlusion - Right side: {Class I|Class II head-to-head|Class II full|Class III|Not assessable due to absence of tooth [number]}
      Molar occlusion - Left side: {Class I|Class II head-to-head|Class II full|Class III|Not assessable due to absence of tooth [number]}
