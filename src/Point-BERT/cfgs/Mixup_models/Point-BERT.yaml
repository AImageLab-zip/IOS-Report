optimizer : {
  type: AdamW,
  kwargs: {
  lr : 0.003, 
  weight_decay : 0.05
}}

scheduler: {
  type: CosLR,
  kwargs: {
    epochs: 100,
    initial_epochs : 5
}}

dataset : {
  train : { _base_: cfgs/dataset_configs/PreprocessedIOS.yaml, 
            others: {subset: 'train', npoints: 32768}},
  val : { _base_: cfgs/dataset_configs/PreprocessedIOS.yaml, 
            others: {subset: 'test', npoints: 32768}}}
model : {
  NAME: Point_BERT, 
  m: 0.999,
  T: 0.07,
  K: 16384,
  
  transformer_config: {
    mask_ratio: [0.25, 0.45], 
    trans_dim: 512, 
    depth: 8, 
    drop_path_rate: 0.1, 
    cls_dim: 512, 
    replace_pob: 0., 
    num_heads: 8, 
    moco_loss: False, 
    dvae_loss: True, 
    cutmix_loss: True, 
    return_all_tokens: False, 
  },
  dvae_config : {
    group_size: 32, 
    num_group: 1024, 
    encoder_dims: 256,
    num_tokens: 4096,
    tokens_dims: 1024, 
    decoder_dims: 256, 
    ckpt: '/work/grana_maxillo/IOS-DraftReport/src/Point-BERT/experiments/dvae/PreprocessedIOS_models/figaroa/ckpt-best.pth'
  }}

total_bs : 64
step_per_update : 1
max_epoch : 100

consider_metric: CDL1
