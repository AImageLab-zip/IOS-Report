optimizer : {
  type: AdamW,
  kwargs: {
  lr : 0.0003, 
  weight_decay : 0.0005
}}

scheduler: {
  type: CosLR,
  kwargs: {
    epochs: 300,
    initial_epochs : 50,
    warming_up_init_lr: 0.00005
}}
temp: {
  start : 1,
  target: 0.0625,
  ntime: 200000 
}

kldweight: {
  start : 0.75,
  target: 1,
  ntime: 100000
}

dataset : {
  train : { _base_: cfgs/dataset_configs/PreprocessedIOS.yaml, 
            others: {subset: 'train', npoints: 32768}},
  val : { _base_: cfgs/dataset_configs/PreprocessedIOS.yaml, 
            others: {subset: 'test', npoints: 32768}},
  test : { _base_: cfgs/dataset_configs/PreprocessedIOS.yaml, 
            others: {subset: 'test', npoints: 32768}}}
model : {
  NAME: DiscreteVAE, 
  group_size: 32, 
  num_group: 1024, 
  encoder_dims: 1024,
  num_tokens: 8192,
  tokens_dims: 1024, 
  decoder_dims: 1024, 
}

total_bs : 8
step_per_update : 1
max_epoch : 300

consider_metric: CDL1
